unbind C-o
unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g default-terminal "${TERM}"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -sg escape-time 0
set -g focus-events on
set -as terminal-features ',*:usstyle'
set -g allow-passthrough on

set -g prefix C-s

set -g mouse on

set -s set-clipboard on

set -g base-index 1
set -g renumber-windows on
set -g status-position top

set -g main-pane-width 60%

set -g detach-on-destroy off
set -g default-shell /opt/homebrew/bin/fish

set -g history-limit 1000000

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Session Management

bind L switch-client -l

# Dim inactive panes
set -g window-style "bg=#{@thm_mantle}"
set -g window-active-style "bg=#{@thm_bg}"

# Pane Management

bind V split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-preview-enabled 'false'
set -g @sessionx-window-height '60%'
set -g @sessionx-window-width '60%'
set -g @sessionx-fzf-builtin-tmux 'off'

# Open lazygit on current dir
# Source: https://github.com/ericmckevitt
bind g display-popup \
    -d "#{pane_current_path}" \
    -w 80% \
    -h 80% \
    -E "lazygit"

# Open terminal in current dir
bind t display-popup \
    -d "#{pane_current_path}" \
    -w 75% \
    -h 75% \
    -E "fish"

bind f display-popup \
    -d "#{pane_current_path}" \
    -w 90% \
    -h 90% \
    -E "yazi"

bind G new-window -n "gh-dash" "gh dash"

bind w display-popup \
    -w 90% \
    -h 90% \
    -E "workmux dashboard"

bind b run-shell "workmux sidebar"

# Theme colors (generated by the `theme` fish function; run `theme catppuccin`
# or `theme rosepine` once if this file doesn't exist yet)
source-file -q ~/.config/tmux/theme.conf

set -g status-style "bg=#{@thm_mantle},fg=#{@thm_fg}"
set -g window-status-format "#[fg=#{@thm_crust},bg=#{@thm_overlay}] #I #[fg=#{@thm_fg},bg=#{@thm_surface}] #W #[fg=#{@thm_fg},bg=#{@thm_mantle}]"
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_accent}] #I #[fg=#{@thm_fg},bg=#{@thm_surface2}] #W #[fg=#{@thm_fg},bg=#{@thm_mantle}]"

set -g status-left-length 100
set -g status-left ""

set -g status-right-length 100
set -g status-right ""
set -ag status-right '#{?window_zoomed_flag,#[fg=#{@thm_crust}]#[bg=#{@thm_peach}] 󰅋 #[fg=#{@thm_fg}]#[bg=#{@thm_mantle}] ,}'
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_green}] 󰣇 #[fg=#{@thm_fg},bg=#{@thm_surface}] #S #[fg=#{@thm_fg},bg=#{@thm_mantle}]"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

set-window-option -g automatic-rename off
set-option -g allow-rename off
