agent: claude --ide
nerdfont: true
status_format: false
status_icons:
  working: ""
  waiting: ""
  done: ""
sidebar:
  group_by: project
  templates:
    grouped:
      tiles:
        - "{primary} {pane_suffix} {fill} {pr_number} {pr_checks}"
        - "{pane_title} {fill} {git_stats}"
files:
  symlink:
    - .envrc
post_create:
  - "$HOME/.local/bin/worktree-setup"
panes:
  - command: nvim
    focus: true
  - command: <agent>
    split: horizontal
  - split: vertical
dashboard:
  agent_columns: [number, project, worktree, pr, status, time, title]
